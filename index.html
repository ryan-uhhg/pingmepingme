<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>프렌즈뽑기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 헤더 -->
  <div id="header">
    <div id="title">프렌즈뽑기</div>
    <div id="header-bar">
      <div id="coin-area">
        <span id="coin-icon">🪙</span>
        <span id="coin-count">∞</span>
        <span id="coin-label">FREE</span>
      </div>
      <button id="btn-collection" onclick="openCollection()">컬렉션</button>
      <button id="btn-edit-names" onclick="openNameEditor()">✏️ 이름편집</button>
    </div>
  </div>

  <!-- 캐비닛 -->
  <div id="cabinet">
    <div id="cabinet-inner">
      <canvas id="gameCanvas"></canvas>
    </div>
    <button id="btn-menu" onclick="toggleMenu()">☰</button>
  </div>

  <!-- 컨트롤 -->
  <div id="controls">
    <button class="ctrl-btn blue"  id="btn-left"    onpointerdown="startMove('left')"  onpointerup="stopMove()" onpointerleave="stopMove()">◀</button>
    <button class="ctrl-btn green" id="btn-forward"  onpointerdown="startMove('right')" onpointerup="stopMove()" onpointerleave="stopMove()">▶</button>
    <div id="depth-slider-wrap">
      <input type="range" id="depth-slider" min="0" max="100" value="50" oninput="setDepth(this.value)">
    </div>
    <button class="ctrl-btn red"   id="btn-drop"    onclick="dropClaw()">▼</button>
  </div>

</div>

<!-- 컬렉션 모달 -->
<div id="modal-collection" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">🎁 내 컬렉션</div>
    <div id="collection-grid"></div>
    <button class="modal-close" onclick="closeCollection()">닫기</button>
  </div>
</div>

<!-- 이름 편집 모달 -->
<div id="modal-names" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">✏️ 친구 이름 편집</div>
    <div id="name-editor-list"></div>
    <div class="modal-footer">
      <button class="btn-save" onclick="saveNames()">저장</button>
      <button class="modal-close" onclick="closeNameEditor()">취소</button>
    </div>
  </div>
</div>

<!-- 성공 오버레이 -->
<div id="overlay-win" class="hidden">
  <div id="win-box">
    <div id="win-char-img"></div>
    <div id="win-char-name"></div>
    <div id="win-msg">뽑았다! 🎉</div>
    <button onclick="closeWin()">계속하기</button>
  </div>
</div>

<!-- 실패 오버레이 -->
<div id="overlay-fail" class="hidden">
  <div id="fail-box">
    <div id="fail-msg">아쉽다... 다시 도전!</div>
    <button onclick="closeFail()">다시하기</button>
  </div>
</div>

<!-- 메뉴 패널 -->
<div id="menu-panel" class="hidden">
  <button onclick="resetCollection()">컬렉션 초기화</button>
  <button onclick="toggleMenu()">닫기</button>
</div>

<script src="game.js"></script>
</body>
</html>
